<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login — EuroPath Education</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
  :root { --navy:#0b1e3f; --ink:#080a14; --electric:#3ddfff; --lime:#c6ff3d; --coral:#ff5c3d; --gray:#6b7280; --light:#e8ecf1; --off:#f4f5f7; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter', -apple-system, sans-serif; background:linear-gradient(160deg, var(--navy) 0%, var(--ink) 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 20px; }
  .card { background:#fff; border-radius:20px; padding:40px; width:100%; max-width:420px; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
  h1 { font-size:24px; font-weight:800; color:var(--ink); margin-bottom:4px; }
  .sub { color:var(--gray); font-size:14px; margin-bottom:28px; }
  label { display:block; font-size:12px; font-weight:600; color:var(--ink); margin-bottom:6px; }
  input { width:100%; padding:12px 14px; border:1px solid #ddd; border-radius:10px; font-size:14px; margin-bottom:18px; outline:none; }
  input:focus { border-color:var(--electric); }
  button { width:100%; padding:14px; border:none; border-radius:10px; background:linear-gradient(135deg, var(--electric), var(--lime)); color:var(--ink); font-size:15px; font-weight:700; cursor:pointer; transition:transform .2s; }
  button:hover { transform:scale(1.02); }
  button:disabled { opacity:0.5; cursor:wait; }
  .toggle { text-align:center; margin-top:20px; font-size:13px; color:var(--gray); }
  .toggle a { color:var(--navy); font-weight:700; cursor:pointer; text-decoration:underline; }
  .error { color:var(--coral); font-size:12px; margin-bottom:14px; display:none; background:#fff0f0; padding:10px; border-radius:8px; }
  .info { color:#1a4a6a; font-size:12px; margin-bottom:14px; display:none; background:#f0f4ff; padding:10px; border-radius:8px; }
  .back { text-align:center; margin-top:16px; }
  .back a { color:var(--gray); font-size:12px; text-decoration:none; }
  .back a:hover { color:var(--navy); }
  #status { font-size:11px; color:var(--gray); text-align:center; margin-top:10px; }
</style>
</head>
<body>

<div class="card">
  <h1 id="title">Sign In</h1>
  <p class="sub" id="subtitle">Access your EuroPath application portal</p>
  <div class="error" id="error"></div>
  <div class="info" id="info"></div>
  <form id="form">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="you@example.com" required>
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••" required>
    <button type="submit" id="btn">Sign In</button>
  </form>
  <div class="toggle">
    <span id="toggleText">New student?</span>
    <a id="toggleLink">Create account</a>
  </div>
  <div class="back"><a href="index.html">← Back to homepage</a></div>
  <div id="status">Loading...</div>
</div>

<script>
const SUPABASE_URL = 'https://glfizcgayqecnvtfihgy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ZPz6L33fOQXqRpl4R5ChAA_JKoeyPXM';

const statusEl = document.getElementById('status');
const form = document.getElementById('form');
const title = document.getElementById('title');
const subtitle = document.getElementById('subtitle');
const btn = document.getElementById('btn');
const toggleLink = document.getElementById('toggleLink');
const toggleText = document.getElementById('toggleText');
const error = document.getElementById('error');
const info = document.getElementById('info');

let supabase = null;
let isLogin = true;

// Load Supabase dynamically
const script = document.createElement('script');
script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';
script.onload = () => {
  statusEl.textContent = '';
  supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Check if already logged in
  supabase.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.href = 'dashboard.html';
  });
};
script.onerror = () => {
  statusEl.textContent = 'Failed to load. Please refresh.';
  btn.disabled = true;
};
document.head.appendChild(script);

toggleLink.addEventListener('click', () => {
  isLogin = !isLogin;
  title.textContent = isLogin ? 'Sign In' : 'Create Account';
  subtitle.textContent = isLogin ? 'Access your EuroPath application portal' : 'Start your European university application';
  btn.textContent = isLogin ? 'Sign In' : 'Create Account';
  toggleText.textContent = isLogin ? 'New student?' : 'Already have an account?';
  toggleLink.textContent = isLogin ? 'Create account' : 'Sign in';
  error.style.display = 'none';
  info.style.display = 'none';
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  if (!supabase) {
    error.textContent = 'Still loading, please wait 2 seconds and try again.';
    error.style.display = 'block';
    return;
  }

  const email = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value;
  error.style.display = 'none';
  info.style.display = 'none';
  btn.disabled = true;
  btn.textContent = isLogin ? 'Signing in...' : 'Creating account...';

  try {
    if (isLogin) {
      const { data, error: err } = await supabase.auth.signInWithPassword({ email, password });
      if (err) throw err;
      window.location.href = 'dashboard.html';
    } else {
      const { data, error: err } = await supabase.auth.signUp({ email, password });
      if (err) throw err;
      if (data.user && data.session) {
        window.location.href = 'dashboard.html';
      } else if (data.user && !data.session) {
        info.innerHTML = 'Account created! Check your email to confirm, then sign in.';
        info.style.display = 'block';
        isLogin = true;
        title.textContent = 'Sign In';
        btn.textContent = 'Sign In';
        toggleText.textContent = 'New student?';
        toggleLink.textContent = 'Create account';
      } else {
        info.textContent = 'Account created! You can now sign in.';
        info.style.display = 'block';
        isLogin = true;
        title.textContent = 'Sign In';
        btn.textContent = 'Sign In';
      }
    }
  } catch (err) {
    error.textContent = err.message || 'Something went wrong.';
    error.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = isLogin ? 'Sign In' : 'Create Account';
  }
});
</script>

</body>
</html>
