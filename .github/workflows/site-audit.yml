name: Site Audit
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'   # weekly Monday audit after the news run
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Full site audit (local)
        run: node .github/scripts/site-audit.mjs
      - name: Live-site audit
        run: node .github/scripts/site-audit.mjs --live
