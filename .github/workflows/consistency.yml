name: Consistency Check
on:
  push:
    branches: [main]
  schedule:
    # After the daily news run — catches drift in generated pages too
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify site consistency vs data/offer.json
        run: node .github/scripts/verify-consistency.mjs
