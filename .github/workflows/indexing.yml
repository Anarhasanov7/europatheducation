name: IndexNow Submission
on:
  push:
    branches: [main]
    paths: ['sitemap.xml', 'news/**', 'en/news/**']
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node .github/scripts/indexnow.mjs
