<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Threads OAuth Callback</title>
<style>
body { font-family: -apple-system, sans-serif; padding: 40px; max-width: 600px; margin: 0 auto; }
#status { padding: 20px; border-radius: 8px; margin: 20px 0; }
.success { background: #d4edda; color: #155724; }
.error { background: #f8d7da; color: #721c24; }
code { background: #f4f4f4; padding: 2px 6px; border-radius: 3px; word-break: break-all; }
</style>
</head>
<body>
<h1>Threads OAuth Callback</h1>
<div id="status">Processing...</div>
<div id="code-display" style="display:none;">
  <p><strong>Authorization Code:</strong></p>
  <p><code id="code"></code></p>
  <p>Copy this code and paste it where requested.</p>
</div>
<script>
const url = new URL(window.location.href);
const code = url.searchParams.get('code');
const error = url.searchParams.get('error');
const status = document.getElementById('status');
const codeDisplay = document.getElementById('code-display');
const codeEl = document.getElementById('code');

if (error) {
  status.className = 'error';
  status.textContent = 'Error: ' + error + ' - ' + url.searchParams.get('error_message');
} else if (code) {
  status.className = 'success';
  status.textContent = 'Authorization successful! Copy the code below.';
  codeDisplay.style.display = 'block';
  codeEl.textContent = code;
} else {
  status.className = 'error';
  status.textContent = 'No code or error received.';
}
</script>
</body>
</html>
