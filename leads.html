<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EuroPath Lead Pipeline</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
  h1 { font-size: 24px; margin-bottom: 20px; color: #38bdf8; }
  .stats { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat-card { background: #1e293b; border-radius: 12px; padding: 15px 20px; min-width: 140px; }
  .stat-card .num { font-size: 28px; font-weight: bold; color: #38bdf8; }
  .stat-card .label { font-size: 12px; color: #94a3b8; margin-top: 4px; }
  .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
  .tab { padding: 8px 16px; border-radius: 8px; background: #1e293b; cursor: pointer; border: none; color: #94a3b8; font-size: 14px; }
  .tab.active { background: #38bdf8; color: #0f172a; font-weight: bold; }
  table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 12px; overflow: hidden; }
  th { text-align: left; padding: 12px 15px; background: #334155; font-size: 13px; color: #94a3b8; }
  td { padding: 10px 15px; border-top: 1px solid #334155; font-size: 14px; }
  tr:hover { background: #334155; }
  .score { font-weight: bold; padding: 3px 8px; border-radius: 6px; font-size: 12px; }
  .score-high { background: #dc2626; color: white; }
  .score-med { background: #f59e0b; color: #0f172a; }
  .score-low { background: #64748b; color: white; }
  .badge { padding: 2px 8px; border-radius: 4px; font-size: 11px; }
  .badge-new { background: #3b82f6; }
  .badge-qualified { background: #8b5cf6; }
  .badge-booked { background: #10b981; }
  .badge-completed { background: #64748b; }
  .badge-questionnaire { background: #f59e0b; color: #0f172a; }
  .lang { font-size: 12px; color: #94a3b8; }
  .source { font-size: 11px; color: #64748b; }
  .empty { text-align: center; padding: 40px; color: #64748b; }
  .refresh { float: right; background: #38bdf8; color: #0f172a; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
  .login { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1e293b; padding: 30px; border-radius: 16px; text-align: center; }
  .login input { width: 250px; padding: 10px; margin: 10px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; }
  .login button { padding: 10px 30px; border-radius: 8px; border: none; background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; }
  .loading { display: inline-block; width: 20px; height: 20px; border: 3px solid #334155; border-top: 3px solid #38bdf8; border-radius: 50%; animation: spin 1s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  .error { color: #ef4444; padding: 20px; text-align: center; }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  @media (max-width: 768px) {
    body { padding: 10px; }
    h1 { font-size: 18px; }
    .stat-card { min-width: 100px; padding: 10px 12px; }
    .stat-card .num { font-size: 22px; }
    th, td { padding: 8px 10px; font-size: 12px; }
  }
</style>
</head>
<body>

<div id="login" class="login">
  <h1>🔐 EuroPath Lead Pipeline</h1>
  <p style="color:#94a3b8; margin: 10px 0;">Enter access password</p>
  <input type="password" id="password" placeholder="Password" onkeypress="if(event.key==='Enter')doLogin()">
  <br>
  <button onclick="doLogin()">Login</button>
  <div id="login-error" style="color:#ef4444; margin-top:10px; font-size:13px; display:none;"></div>
</div>

<div id="dashboard" style="display:none;">
  <h1>🎓 EuroPath Lead Pipeline <button class="refresh" onclick="loadData()">↻ Refresh</button> <span id="last-updated" style="font-size:12px; color:#64748b; font-weight:normal;"></span></h1>

  <div class="stats" id="stats"></div>

  <div class="tabs">
    <button class="tab active" onclick="setTab('all', this)">All Leads</button>
    <button class="tab" onclick="setTab('qualified', this)">Qualified</button>
    <button class="tab" onclick="setTab('booked', this)">Booked</button>
    <button class="tab" onclick="setTab('completed', this)">Completed</button>
  </div>

  <div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Score</th>
        <th>Name</th>
        <th>Platform</th>
        <th>Lang</th>
        <th>Source</th>
        <th>Status</th>
        <th>Education</th>
        <th>Field</th>
        <th>Scholarship</th>
        <th>Start</th>
        <th>Consultation</th>
        <th>Joined</th>
        <th>Chat ID</th>
      </tr>
    </thead>
    <tbody id="leads-tbody">
      <tr><td colspan="13" class="empty">Loading...</td></tr>
    </tbody>
  </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://glfizcgayqecnvtfihgy.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdsZml6Y2dheXFlY252dGZpaGd5Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4ODAxMDMwNSwiZXhwIjoyMTAzNTg2MzA1fQ.NGMeiFUAGkaR5h7yHGxuzEGjB_y2niWRKviH5Yf4qHo';

const PASSWORD = 'EuroPath2026!Leads';
let supabaseClient = null;
let currentTab = 'all';
let autoRefreshTimer = null;

function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function doLogin() {
  const pw = document.getElementById('password').value;
  const errEl = document.getElementById('login-error');
  if (pw === PASSWORD) {
    errEl.style.display = 'none';
    if (!window.supabase || !window.supabase.createClient) {
      errEl.textContent = 'Error: Supabase library failed to load. Check your internet connection.';
      errEl.style.display = 'block';
      return;
    }
    document.getElementById('login').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    loadData();
    // Auto-refresh every 30 seconds
    autoRefreshTimer = setInterval(loadData, 30000);
  } else {
    errEl.textContent = 'Wrong password. Please try again.';
    errEl.style.display = 'block';
  }
}

function setTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  loadData();
}

async function loadData() {
  const tbody = document.getElementById('leads-tbody');
  tbody.innerHTML = '<tr><td colspan="13" class="empty"><span class="loading"></span>Loading leads...</td></tr>';

  if (!supabaseClient) {
    tbody.innerHTML = '<tr><td colspan="13" class="error">Not connected. Please reload and login.</td></tr>';
    return;
  }

  // Always fetch all leads for stats (not filtered by tab)
  const { data: allLeads, error: allErr } = await supabaseClient
    .from('social_leads')
    .select('*')
    .order('created_at', { ascending: false })
    .limit(100);

  if (allErr) {
    tbody.innerHTML = `<tr><td colspan="13" class="error">Error: ${escapeHtml(allErr.message || 'Unknown error')}</td></tr>`;
    return;
  }

  const allData = allLeads || [];
  document.getElementById('last-updated').textContent = `(Updated ${new Date().toLocaleTimeString()})`;

  // Stats — always from ALL leads, regardless of active tab
  const total = allData.length;
  const qualified = allData.filter(l => l.questionnaire_completed).length;
  const booked = allData.filter(l => l.consultation_booked).length;
  const completed = allData.filter(l => l.consultation_completed).length;
  const scoredLeads = allData.filter(l => l.lead_score != null);
  const avgScore = scoredLeads.length ? Math.round(scoredLeads.reduce((a, l) => a + (l.lead_score || 0), 0) / scoredLeads.length) : 0;

  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="num">${total}</div><div class="label">Total Leads</div></div>
    <div class="stat-card"><div class="num">${qualified}</div><div class="label">Qualified</div></div>
    <div class="stat-card"><div class="num">${booked}</div><div class="label">Booked</div></div>
    <div class="stat-card"><div class="num">${completed}</div><div class="label">Completed</div></div>
    <div class="stat-card"><div class="num">${avgScore}</div><div class="label">Avg Score</div></div>
  `;

  // Filter data for the current tab
  let data = allLeads;
  if (currentTab === 'qualified') {
    data = allData.filter(l => l.questionnaire_completed);
  } else if (currentTab === 'booked') {
    data = allData.filter(l => l.consultation_booked);
  } else if (currentTab === 'completed') {
    data = allData.filter(l => l.consultation_completed);
  }

  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="13" class="empty">No leads found yet. Leads will appear here when people message the bot.</td></tr>';
    return;
  }

  const eduLabels = { high_school: 'High school', bachelor: "Bachelor's", master: "Master's", other: 'Other' };
  const schLabels = { full: 'Full', partial: 'Partial', no: 'Self-funded' };
  const statusBadges = {
    new: '<span class="badge badge-new">New</span>',
    questionnaire: '<span class="badge badge-questionnaire">Questionnaire</span>',
    qualified: '<span class="badge badge-qualified">Qualified</span>',
    consultation_booked: '<span class="badge badge-booked">Booked</span>',
    dm_sent: '<span class="badge badge-qualified">DM Sent</span>',
    engaged: '<span class="badge badge-new">Engaged</span>',
    completed: '<span class="badge badge-completed">Completed</span>',
  };

  const rows = data.map(l => {
    const answers = l.questionnaire_answers || {};
    const score = l.lead_score || 0;
    const scoreClass = score >= 70 ? 'score-high' : score >= 40 ? 'score-med' : 'score-low';
    const name = escapeHtml(l.platform_display_name || l.platform_username || 'Unknown');
    const consult = l.consultation_scheduled_at
      ? new Date(l.consultation_scheduled_at).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZone: 'Asia/Baku' })
      : '—';
    const joined = l.created_at
      ? new Date(l.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
      : '—';
    const langFlag = { en: '🇬🇧', ru: '🇷🇺', az: '🇦🇿' }[l.lead_language] || '🌐';

    return `<tr>
      <td><span class="score ${scoreClass}">${score}</span></td>
      <td>${name}</td>
      <td>${escapeHtml(l.platform || '—')}</td>
      <td class="lang">${langFlag} ${escapeHtml(l.lead_language || 'en')}</td>
      <td class="source">${escapeHtml(l.lead_source || '—')}</td>
      <td>${statusBadges[l.status] || escapeHtml(l.status || '—')}</td>
      <td>${eduLabels[answers.education_level] ? escapeHtml(eduLabels[answers.education_level]) : '—'}</td>
      <td>${escapeHtml(answers.field_of_study || '—')}</td>
      <td>${schLabels[answers.scholarship_needed] ? escapeHtml(schLabels[answers.scholarship_needed]) : '—'}</td>
      <td>${escapeHtml(answers.start_year || '—')}</td>
      <td>${escapeHtml(consult)}</td>
      <td>${escapeHtml(joined)}</td>
      <td>${escapeHtml(l.telegram_chat_id || '—')}</td>
    </tr>`;
  }).join('');

  tbody.innerHTML = rows;
}
</script>
</body>
</html>
