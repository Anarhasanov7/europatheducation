<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — EuroPath Education</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
  :root { --navy:#0b1e3f; --ink:#080a14; --electric:#3ddfff; --blue:#2E86C1; --lime:#c6ff3d; --gray:#6b7280; --light:#e8ecf1; --off:#f4f5f7; --green:#22c55e; --red:#ef4444; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter', -apple-system, sans-serif; background:var(--off); color:var(--ink); }

  /* Login */
  #loginOverlay { position:fixed; inset:0; background:linear-gradient(135deg,#0b1e3f,#16213e); display:flex; align-items:center; justify-content:center; z-index:100; }
  .login-box { background:#fff; border-radius:16px; padding:40px; width:380px; box-shadow:0 20px 60px rgba(0,0,0,.3); }
  .login-box h1 { font-size:24px; margin-bottom:4px; }
  .login-box .sub { color:var(--gray); margin-bottom:24px; font-size:14px; }
  .login-box input { width:100%; padding:12px 16px; border:1px solid #ddd; border-radius:8px; font-size:14px; margin-bottom:12px; }
  .login-box button { width:100%; padding:12px; background:var(--blue); color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; }
  .login-box button:hover { background:#1a6ba8; }
  .login-box button:disabled { opacity:.6; cursor:wait; }
  .login-error { color:var(--red); font-size:13px; margin-top:8px; display:none; }
  .login-divider { display:flex; align-items:center; gap:12px; margin:16px 0; }
  .login-divider::before, .login-divider::after { content:''; flex:1; height:1px; background:#e0e0e0; }
  .login-divider span { font-size:12px; color:#888; }
  .login-github { width:100%; padding:12px 14px; border:1px solid #ddd; border-radius:8px; background:#24292f; color:#fff; font-size:14px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; transition:background .2s; font-family:'Inter',sans-serif; }
  .login-github:hover { background:#1c2025; }
  .login-github:disabled { opacity:0.5; cursor:wait; }
  .login-github svg { width:20px; height:20px; }

  /* Header */
  .header { background:#fff; border-bottom:1px solid #e0e0e0; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:10; }
  .header h1 { font-size:18px; color:var(--blue); }
  .header .user-info { font-size:13px; color:var(--gray); }
  .logout-btn { background:none; border:1px solid #ddd; padding:6px 16px; border-radius:6px; cursor:pointer; font-size:13px; color:#666; }
  .logout-btn:hover { background:#f5f5f5; }

  /* Stats */
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; padding:24px; max-width:1400px; margin:0 auto; }
  .stat-card { background:#fff; border-radius:12px; padding:20px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .stat-card .label { font-size:11px; color:#888; text-transform:uppercase; letter-spacing:.5px; }
  .stat-card .value { font-size:32px; font-weight:700; margin-top:4px; }
  .stat-card .value.blue { color:var(--blue); }
  .stat-card .value.green { color:var(--green); }
  .stat-card .value.orange { color:#e67e22; }

  /* Filter */
  .filter-bar { display:flex; gap:12px; padding:0 24px 16px; max-width:1400px; margin:0 auto; }
  .filter-bar input, .filter-bar select { padding:8px 12px; border:1px solid #ddd; border-radius:6px; font-size:14px; }
  .filter-bar input { flex:1; }

  /* Table */
  .table-container { max-width:1400px; margin:0 auto; padding:0 24px 24px; }
  .table-wrap { background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  table { width:100%; border-collapse:collapse; }
  th { background:#f8f9fa; padding:12px 16px; text-align:left; font-size:11px; text-transform:uppercase; color:#666; letter-spacing:.5px; border-bottom:1px solid #e0e0e0; }
  td { padding:12px 16px; border-bottom:1px solid #f0f0f0; font-size:14px; }
  tr:hover { background:#f8f9fa; cursor:pointer; }
  .badge { display:inline-block; padding:3px 10px; border-radius:12px; font-size:11px; font-weight:600; text-transform:uppercase; }
  .badge.submitted { background:#d4edda; color:#155724; }
  .badge.draft { background:#fff3cd; color:#856404; }

  /* Modal */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal-overlay.active { display:flex; }
  .modal { background:#fff; border-radius:16px; max-width:700px; width:100%; max-height:85vh; overflow-y:auto; padding:32px; }
  .modal h2 { font-size:22px; margin-bottom:4px; }
  .modal .sub { color:#666; font-size:14px; margin-bottom:24px; }
  .modal-close { float:right; background:none; border:none; font-size:24px; cursor:pointer; color:#999; }
  .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:24px; }
  .info-item { padding:12px; background:#f8f9fa; border-radius:8px; }
  .info-item .key { font-size:11px; color:#888; text-transform:uppercase; }
  .info-item .val { font-size:15px; font-weight:500; margin-top:2px; word-break:break-word; }
  .docs-list h3 { font-size:16px; margin-bottom:12px; color:var(--blue); }
  .doc-item { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:#f8f9fa; border-radius:8px; margin-bottom:8px; }
  .doc-item .doc-type { font-weight:600; color:var(--blue); font-size:14px; }
  .doc-item .doc-file { color:#666; font-size:13px; margin-left:12px; }
  .doc-item a { color:var(--blue); text-decoration:none; font-size:13px; font-weight:600; }
  .doc-item a:hover { text-decoration:underline; }
  .doc-missing { color:#ccc; font-style:italic; }
  .empty { text-align:center; padding:60px; color:#888; }

  /* Pagination */
  .pagination { display:flex; gap:8px; align-items:center; justify-content:center; padding:16px 24px; max-width:1400px; margin:0 auto; }
  .pagination button { padding:6px 12px; border:1px solid #ddd; border-radius:6px; background:#fff; cursor:pointer; font-size:13px; color:#333; }
  .pagination button:hover:not(:disabled) { background:#f0f0f0; }
  .pagination button:disabled { opacity:0.4; cursor:default; }
  .pagination button.active { background:var(--electric); color:#080a14; border-color:var(--electric); font-weight:700; }
  .pagination .page-info { font-size:13px; color:#666; margin:0 8px; }

  @media (max-width:768px) {
    .info-grid { grid-template-columns:1fr; }
    .stats { grid-template-columns:1fr 1fr; }
    table { font-size:12px; }
    th, td { padding:8px; }
    .hide-mobile { display:none; }
  }

  /* ─── Tab navigation ─── */
  .tab-bar { display:flex; gap:0; max-width:1400px; margin:0 auto; padding:0 24px; border-bottom:2px solid #e0e0e0; }
  .tab-btn { padding:12px 24px; border:none; background:none; font-size:14px; font-weight:600; cursor:pointer; color:#666; border-bottom:3px solid transparent; margin-bottom:-2px; transition:all .2s; font-family:'Inter',sans-serif; }
  .tab-btn:hover { color:var(--blue); }
  .tab-btn.active { color:var(--blue); border-bottom-color:var(--blue); }
  .tab-btn .tab-badge { display:inline-block; margin-left:6px; padding:1px 8px; border-radius:10px; font-size:11px; font-weight:700; background:#ef4444; color:#fff; }
  .tab-btn .tab-badge.zero { background:#ccc; }

  /* ─── Ticket styles ─── */
  .badge.open { background:#fee2e2; color:#991b1b; }
  .badge.answered { background:#d4edda; color:#155724; }
  .badge.closed { background:#e0e0e0; color:#666; }
  .ticket-reply-area { margin-top:20px; padding-top:20px; border-top:1px solid #eee; }
  .ticket-reply-area h3 { font-size:16px; margin-bottom:12px; color:var(--blue); }
  .ticket-reply-area textarea { width:100%; min-height:120px; padding:14px; border:1px solid #ddd; border-radius:10px; font-size:14px; font-family:'Inter',sans-serif; resize:vertical; outline:none; transition:border-color .2s; }
  .ticket-reply-area textarea:focus { border-color:var(--blue); }
  .ticket-reply-area .reply-btn { margin-top:12px; padding:12px 28px; background:var(--blue); color:#fff; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; }
  .ticket-reply-area .reply-btn:hover { background:#1a6ba8; }
  .ticket-reply-area .reply-btn:disabled { opacity:.5; cursor:wait; }
  .ticket-original-msg { padding:14px; background:#f8f9fa; border-radius:10px; font-size:13px; line-height:1.7; white-space:pre-wrap; color:#444; margin:12px 0; }
  .ticket-admin-reply { padding:14px; background:#e8f5e9; border-radius:10px; font-size:13px; line-height:1.7; white-space:pre-wrap; color:#1b5e20; margin:12px 0; border-left:3px solid var(--green); }
  .conv-msg { margin-bottom:12px; padding:14px; border-radius:10px; }
  .conv-msg.student { background:#f0f4ff; border-left:3px solid var(--electric); }
  .conv-msg.admin { background:#e8f5e9; border-left:3px solid var(--green); }
  .conv-msg .sender { font-size:11px; font-weight:700; text-transform:uppercase; margin-bottom:6px; }
  .conv-msg.student .sender { color:#1a4a6a; }
  .conv-msg.admin .sender { color:#1b5e20; }
  .conv-msg .text { font-size:13px; line-height:1.6; white-space:pre-wrap; color:#333; }
  .conv-msg .time { font-size:11px; color:#999; margin-top:6px; }
  .conv-msg .att { margin-top:8px; padding:8px 12px; background:#fff; border:1px solid #ddd; border-radius:6px; font-size:12px; }
  .conv-msg .att a { color:var(--blue); font-weight:600; text-decoration:none; }
  .conv-msg .file-req { margin-top:8px; padding:10px 12px; background:#fff3cd; border-radius:6px; border-left:3px solid #ffc107; font-size:12px; }
  .conv-msg .file-req strong { color:#856404; }
  .file-request-field { margin-top:12px; }
  .file-request-field label { font-size:13px; font-weight:600; color:var(--ink); display:block; margin-bottom:4px; }
  .file-request-field input { width:100%; padding:10px 12px; border:1px solid #ddd; border-radius:8px; font-size:13px; outline:none; }
  .file-request-field input:focus { border-color:var(--blue); }
  .file-request-field .hint { font-size:11px; color:#888; margin-top:4px; }

  /* Language toggle */
  .lang-toggle { display: flex; align-items: center; gap: 4px; position: fixed; top: 16px; right: 20px; z-index: 999; }
  .lang-btn { font-size: 18px; line-height: 1; cursor: pointer; border: 2px solid transparent; border-radius: 6px; padding: 4px 6px; background: transparent; transition: all 0.2s; opacity: 0.5; }
  .lang-btn:hover { opacity: 0.8; }
  .lang-btn.active { opacity: 1; border-color: #1a73e8; background: rgba(26,115,232,0.1); }
</style>
</head>
<body>

<div class="lang-toggle">
  <button class="lang-btn" id="lang-ru" onclick="edupathI18n.setLang('ru')" title="Русский">🇷🇺</button>
  <button class="lang-btn" id="lang-en" onclick="edupathI18n.setLang('en')" title="English">🇬🇧</button>
</div>
<script src="i18n.js"></script>

<div id="loginOverlay">
  <div class="login-box">
    <h1 data-en="Admin Dashboard">Админ-панель</h1>
    <p class="sub" data-en="EuroPath Education — Sign in to view applications">EuroPath Education — Войдите для просмотра заявок</p>
    <input type="email" id="adminEmail" placeholder="Email администратора" data-en-placeholder="Admin email" value="hasanov.anar.2023@gmail.com">
    <input type="password" id="adminPassword" placeholder="Пароль" data-en-placeholder="Password">
    <button id="loginBtn" onclick="adminLogin()" data-en="Sign In">Войти</button>
    <div class="login-error" id="loginError"></div>
    <div class="login-divider"><span data-en="or">или</span></div>
    <button class="login-github" id="githubLoginBtn" onclick="adminGitHubLogin()">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      <span data-en="Continue with GitHub">Продолжить с GitHub</span>
    </button>
  </div>
</div>

<div class="header" id="mainHeader" style="display:none;">
  <h1 data-en="EuroPath Education — Admin">EuroPath Education — Админ</h1>
  <div style="display:flex; align-items:center; gap:16px;">
    <span class="user-info" id="adminInfo"></span>
    <button class="logout-btn" onclick="adminLogout()" data-en="Logout">Выход</button>
  </div>
</div>

<div class="stats" id="statsSection" style="display:none;">
  <div class="stat-card"><div class="label" data-en="Total Applications">Всего заявок</div><div class="value blue" id="statTotal">0</div></div>
  <div class="stat-card"><div class="label" data-en="Submitted">Отправленные</div><div class="value green" id="statSubmitted">0</div></div>
  <div class="stat-card"><div class="label" data-en="Drafts">Черновики</div><div class="value orange" id="statDraft">0</div></div>
  <div class="stat-card"><div class="label" data-en="Documents">Документы</div><div class="value" id="statDocs">0</div></div>
  <div class="stat-card"><div class="label" data-en="Open Tickets">Открытые тикеты</div><div class="value red" id="statTickets" style="color:var(--red);">0</div></div>
</div>

<div class="tab-bar" id="tabBar" style="display:none;">
  <button class="tab-btn active" id="tabApps" onclick="switchTab('apps')" data-en="📋 Applications">📋 Заявки</button>
  <button class="tab-btn" id="tabTickets" onclick="switchTab('tickets')">🎫 <span data-en="Tickets">Тикеты</span> <span class="tab-badge zero" id="ticketBadge">0</span></button>
</div>

<div class="filter-bar" id="filterBar" style="display:none;">
  <input type="text" id="searchInput" placeholder="Поиск по имени, email, университету..." data-en-placeholder="Search by name, email, university..." oninput="currentPage=1;renderTable()">
  <select id="statusFilter" onchange="currentPage=1;renderTable()">
    <option value="" data-en="All Status">Все статусы</option>
    <option value="submitted" data-en="Submitted">Отправленные</option>
    <option value="draft" data-en="Draft">Черновик</option>
  </select>
  <button onclick="exportCSV()" style="padding:8px 16px; border:1px solid #ddd; border-radius:8px; background:#fff; cursor:pointer; font-size:13px; font-weight:600; margin-left:auto;" data-en="Export CSV">Экспорт CSV</button>
</div>

<div class="table-container" id="tableSection" style="display:none;">
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th data-en="Student">Студент</th>
          <th data-en="Email">Email</th>
          <th class="hide-mobile" data-en="Country">Страна</th>
          <th class="hide-mobile" data-en="Programs">Программы</th>
          <th data-en="Docs">Документы</th>
          <th data-en="Status">Статус</th>
          <th class="hide-mobile" data-en="Date">Дата</th>
        </tr>
      </thead>
      <tbody id="appsTableBody"></tbody>
    </table>
  </div>
  <div class="pagination" id="paginationControls"></div>
</div>

<!-- ─── Tickets section ─── -->
<div class="table-container" id="ticketsSection" style="display:none;">
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th data-en="Ticket ID">ID тикета</th>
          <th data-en="Name">Имя</th>
          <th class="hide-mobile" data-en="Category">Категория</th>
          <th class="hide-mobile" data-en="Subject">Тема</th>
          <th data-en="Status">Статус</th>
          <th class="hide-mobile" data-en="Date">Дата</th>
        </tr>
      </thead>
      <tbody id="ticketsTableBody"></tbody>
    </table>
  </div>
  <div class="pagination" id="ticketPaginationControls"></div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
function lang() { return localStorage.getItem('edupath_lang') || 'ru'; }
const SUPABASE_URL = 'https://glfizcgayqecnvtfihgy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ZPz6L33fOQXqRpl4R5ChAA_JKoeyPXM';
let sb;
let allApps = [];
let allDocs = [];
let allTickets = [];
let currentUser = null;
let currentPage = 1;
let ticketCurrentPage = 1;
let currentTab = 'apps';
const PAGE_SIZE = 25;

// Escape user-provided data to prevent XSS
function esc(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

(function loadSB() {
  if (window.supabase) { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); checkSession(); }
  else { setTimeout(loadSB, 100); }
})();

async function checkSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) { currentUser = session.user; showAdmin(); }
}

async function adminGitHubLogin() {
  const btn = document.getElementById('githubLoginBtn');
  const err = document.getElementById('loginError');
  btn.disabled = true;
  btn.textContent = lang() === 'en' ? 'Redirecting...' : 'Перенаправление...';
  err.style.display = 'none';
  try {
    const { data, error: e } = await sb.auth.signInWithOAuth({
      provider: 'github',
      options: { redirectTo: window.location.origin + '/europatheducation/admin.html' }
    });
    if (e) throw e;
  } catch (e) {
    err.textContent = e.message || (lang() === 'en' ? 'GitHub sign-in failed.' : 'Ошибка входа через GitHub.');
    err.style.display = 'block';
    btn.disabled = false;
    btn.innerHTML = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0016 8c0-4.42-3.58-8-8-8z"/></svg> ' + (lang() === 'en' ? 'Continue with GitHub' : 'Продолжить с GitHub');
  }
}

async function adminLogin() {
  const email = document.getElementById('adminEmail').value;
  const password = document.getElementById('adminPassword').value;
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginError');
  btn.disabled = true; btn.textContent = lang() === 'en' ? 'Signing in...' : 'Вход...'; err.style.display = 'none';

  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    err.textContent = error.message;
    err.style.display = 'block';
    btn.disabled = false; btn.textContent = lang() === 'en' ? 'Sign In' : 'Войти';
  } else {
    currentUser = data.user;
    showAdmin();
  }
}

function adminLogout() {
  sb.auth.signOut();
  currentUser = null;
  document.getElementById('loginOverlay').style.display = 'flex';
  document.getElementById('mainHeader').style.display = 'none';
  document.getElementById('statsSection').style.display = 'none';
  document.getElementById('filterBar').style.display = 'none';
  document.getElementById('tableSection').style.display = 'none';
}

async function showAdmin() {
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('mainHeader').style.display = 'flex';
  document.getElementById('statsSection').style.display = 'grid';
  document.getElementById('tabBar').style.display = 'flex';
  document.getElementById('filterBar').style.display = 'flex';
  document.getElementById('tableSection').style.display = 'block';
  document.getElementById('ticketsSection').style.display = 'none';
  document.getElementById('adminInfo').textContent = currentUser.email;

  // Load all applications
  const { data: apps, error } = await sb.from('applications').select('*').order('created_at', { ascending: false });
  if (error) { console.error(error); return; }
  allApps = apps || [];

  // Load all documents
  const { data: docs } = await sb.from('documents').select('*').order('created_at', { ascending: false });
  allDocs = docs || [];

  // Load all tickets
  const { data: tickets } = await sb.from('tickets').select('*').order('created_at', { ascending: false });
  allTickets = tickets || [];

  // Stats
  document.getElementById('statTotal').textContent = allApps.length;
  document.getElementById('statSubmitted').textContent = allApps.filter(a => a.status === 'submitted').length;
  document.getElementById('statDraft').textContent = allApps.filter(a => a.status === 'draft').length;
  document.getElementById('statDocs').textContent = allDocs.length;
  const openTickets = allTickets.filter(t => t.status === 'open').length;
  document.getElementById('statTickets').textContent = openTickets;
  const badge = document.getElementById('ticketBadge');
  badge.textContent = openTickets;
  badge.classList.toggle('zero', openTickets === 0);

  renderTable();
  renderTickets();
}

function renderTable() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const statusF = document.getElementById('statusFilter').value;
  const tbody = document.getElementById('appsTableBody');
  const paginationEl = document.getElementById('paginationControls');

  let filtered = allApps;
  if (statusF) filtered = filtered.filter(a => a.status === statusF);
  if (search) filtered = filtered.filter(a =>
    (a.full_name || '').toLowerCase().includes(search) ||
    (a.id || '').toLowerCase().includes(search) ||
    (a.university || '').toLowerCase().includes(search) ||
    (a.country || '').toLowerCase().includes(search)
  );

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="empty"><h3>' + (lang() === 'en' ? 'No applications found' : 'Заявки не найдены') + '</h3></td></tr>';
    paginationEl.innerHTML = '';
    return;
  }

  // Pagination
  const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
  if (currentPage > totalPages) currentPage = 1;
  const startIdx = (currentPage - 1) * PAGE_SIZE;
  const pageItems = filtered.slice(startIdx, startIdx + PAGE_SIZE);

  tbody.innerHTML = pageItems.map(a => {
    const userDocs = allDocs.filter(d => d.user_id === a.user_id);
    const date = new Date(a.created_at).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
    // Build programs display from programs array (fallback to old single field)
    let progs = [];
    if (a.programs && Array.isArray(a.programs) && a.programs.length > 0) {
      progs = a.programs;
    } else if (a.university && a.program) {
      progs = [{ university: a.university, program: a.program }];
    }
    const progsHtml = progs.length > 0
      ? progs.map((p, i) => `<div style="margin-bottom:2px;"><strong>${i + 1}.</strong> ${esc(p.university)}<br><span style="color:#666;font-size:11px;">${esc(p.program)}</span></div>`).join('')
      : '—';
    return `<tr onclick="openModal('${esc(a.id)}')">
      <td><strong>${a.full_name ? esc(a.full_name) : '<span style="color:#ccc">' + (lang() === 'en' ? 'Not provided' : 'Не указано') + '</span>'}</strong></td>
      <td style="font-size:13px;">${esc(a.user_id.slice(0,8))}...</td>
      <td class="hide-mobile">${esc(a.country) || '—'}</td>
      <td class="hide-mobile" style="font-size:12px;">${progsHtml}</td>
      <td>${userDocs.length}/6</td>
      <td><span class="badge ${esc(a.status)}">${esc(a.status)}</span></td>
      <td class="hide-mobile" style="font-size:12px;color:#666;">${esc(date)}</td>
    </tr>`;
  }).join('');

  // Render pagination controls
  if (totalPages <= 1) {
    paginationEl.innerHTML = `<span class="page-info">${filtered.length} ${lang() === 'en' ? 'application' : 'заявка'}${filtered.length !== 1 ? (lang() === 'en' ? 's' : '') : ''}</span>`;
  } else {
    let html = '';
    html += `<button onclick="goToPage(1)" ${currentPage === 1 ? 'disabled' : ''}>«</button>`;
    html += `<button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>‹</button>`;
    const maxButtons = 5;
    let startPage = Math.max(1, currentPage - Math.floor(maxButtons / 2));
    let endPage = Math.min(totalPages, startPage + maxButtons - 1);
    if (endPage - startPage < maxButtons - 1) startPage = Math.max(1, endPage - maxButtons + 1);
    for (let p = startPage; p <= endPage; p++) {
      html += `<button onclick="goToPage(${p})" class="${p === currentPage ? 'active' : ''}">${p}</button>`;
    }
    html += `<button onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>›</button>`;
    html += `<button onclick="goToPage(${totalPages})" ${currentPage === totalPages ? 'disabled' : ''}>»</button>`;
    html += `<span class="page-info">${filtered.length} ${lang() === 'en' ? 'total' : 'всего'} · ${lang() === 'en' ? 'Page' : 'Стр.'} ${currentPage}/${totalPages}</span>`;
    paginationEl.innerHTML = html;
  }
}

function goToPage(page) {
  currentPage = page;
  renderTable();
}

function exportCSV() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const statusF = document.getElementById('statusFilter').value;
  let filtered = allApps;
  if (statusF) filtered = filtered.filter(a => a.status === statusF);
  if (search) filtered = filtered.filter(a =>
    (a.full_name || '').toLowerCase().includes(search) ||
    (a.university || '').toLowerCase().includes(search) ||
    (a.country || '').toLowerCase().includes(search)
  );

  const headers = lang() === 'en'
    ? ['Full Name', 'Email', 'Country', 'Program 1', 'Program 2', 'Program 3', 'Documents', 'Status', 'Date']
    : ['ФИО', 'Email', 'Страна', 'Программа 1', 'Программа 2', 'Программа 3', 'Документы', 'Статус', 'Дата'];
  const rows = filtered.map(a => {
    const userDocs = allDocs.filter(d => d.user_id === a.user_id);
    const date = new Date(a.created_at).toLocaleDateString('en-GB');
    let progs = [];
    if (a.programs && Array.isArray(a.programs) && a.programs.length > 0) {
      progs = a.programs;
    } else if (a.university && a.program) {
      progs = [{ university: a.university, program: a.program }];
    }
    const p1 = progs[0] ? progs[0].university + ' — ' + progs[0].program : '';
    const p2 = progs[1] ? progs[1].university + ' — ' + progs[1].program : '';
    const p3 = progs[2] ? progs[2].university + ' — ' + progs[2].program : '';
    return [a.full_name || '', a.user_id, a.country || '', p1, p2, p3, userDocs.length + '/6', a.status, date];
  });

  let csv = headers.join(',') + '\n';
  rows.forEach(r => {
    csv += r.map(field => '"' + String(field).replace(/"/g, '""') + '"').join(',') + '\n';
  });

  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'applications_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

    const now = new Date().toISOString();

      <div class="info-item"><div class="key">${lang() === 'en' ? 'Status' : 'Статус'}</div><div class="val"><span class="badge ${esc(app.status)}">${esc(app.status)}</span></div></div>

          }
        </div>
        ${isClosed ? '<div style="margin-top:8px; font-size:12px; color:#991b1b;">This ticket is closed. The student can open a new ticket.</div>' : ''}
      </div>
    `;

    document.getElementById('convLoading').innerHTML = convHtml;
  } catch (err) {
    console.error('Conversation load error:', err);
    document.getElementById('convLoading').innerHTML = '<p style="color:var(--red);">Failed to load conversation.</p>';
  }
}

async function downloadAttachment(ticketId, fileName, sender) {
  try {
    const session = await sb.auth.getSession();
    const token = session.data.session?.access_token;
    // Query the message to get the path
    const { data, error } = await sb
      .from('ticket_messages')
      .select('attachment_path')
      .eq('ticket_id', ticketId)
      .eq('sender', sender)
      .eq('attachment_name', fileName)
      .single();

    if (error || !data?.attachment_path) {
      alert('Attachment not found');
      return;
    }

    const { data: urlData, error: urlErr } = await sb.storage
      .from('ticket-attachments')
      .createSignedUrl(data.attachment_path, 3600);

    if (urlErr || !urlData?.signedUrl) {
      alert('Failed to generate download link');
      return;
    }

    window.open(urlData.signedUrl, '_blank');
  } catch (err) {
    console.error('Download error:', err);
    alert('Failed to download attachment');
  }
}

async function sendTicketReply(ticketId) {
  const reply = document.getElementById('replyText').value.trim();
  const fileReq = document.getElementById('fileRequest')?.value.trim() || '';
  const btn = document.getElementById('replyBtn');
  if (!reply) return;

  btn.disabled = true;
  btn.textContent = 'Sending...';

  try {
    const session = await sb.auth.getSession();
    const token = session.data.session?.access_token;
    const res = await fetch('https://glfizcgayqecnvtfihgy.supabase.co/functions/v1/reply-ticket', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ ticket_id: ticketId, reply_message: reply, file_request: fileReq || null })
    });
    const data = await res.json();
    if (data.success) {
      // Update local cache
      const t = allTickets.find(t => t.ticket_id === ticketId);
      if (t) {
        t.status = 'answered';
        t.admin_reply = reply;
        t.replied_at = new Date().toISOString();
        t.replied_by = currentUser.email;
      }
      // Update stats
      const openTickets = allTickets.filter(t => t.status === 'open').length;
      document.getElementById('statTickets').textContent = openTickets;
      const badge = document.getElementById('ticketBadge');
      badge.textContent = openTickets;
      badge.classList.toggle('zero', openTickets === 0);

      renderTickets();
      closeModal();
    } else {
      btn.disabled = false;
      btn.textContent = 'Send Reply';
      console.error('Reply failed:', data.message);
    }
  } catch (err) {
    console.error('Reply error:', err);
    btn.disabled = false;
    btn.textContent = 'Send Reply';
  }
}

async function closeTicket(ticketId) {
  if (!confirm('Close this ticket? The student will not be able to reply, but can open a new ticket.')) return;
  try {
    const { error } = await sb
      .from('tickets')
      .update({ status: 'closed', closed_at: new Date().toISOString() })
      .eq('ticket_id', ticketId);
    if (error) { alert('Error: ' + error.message); return; }
    // Update local cache
    const t = allTickets.find(t => t.ticket_id === ticketId);
    if (t) { t.status = 'closed'; t.closed_at = new Date().toISOString(); }
    const openTickets = allTickets.filter(t => t.status === 'open').length;
    document.getElementById('statTickets').textContent = openTickets;
    const badge = document.getElementById('ticketBadge');
    badge.textContent = openTickets;
    badge.classList.toggle('zero', openTickets === 0);
    renderTickets();
    closeModal();
  } catch (err) { alert('Error closing ticket'); }
}

async function reopenTicket(ticketId) {
  try {
    const { error } = await sb
      .from('tickets')
      .update({ status: 'answered', closed_at: null })
      .eq('ticket_id', ticketId);
    if (error) { alert('Error: ' + error.message); return; }
    const t = allTickets.find(t => t.ticket_id === ticketId);
    if (t) { t.status = 'answered'; t.closed_at = null; }
    const openTickets = allTickets.filter(t => t.status === 'open').length;
    document.getElementById('statTickets').textContent = openTickets;
    const badge = document.getElementById('ticketBadge');
    badge.textContent = openTickets;
    badge.classList.toggle('zero', openTickets === 0);
    renderTickets();
    closeModal();
  } catch (err) { alert('Error reopening ticket'); }
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1048576).toFixed(1) + ' MB';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
